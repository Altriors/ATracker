name: Emulator UI tests

# Expensive (about 5 minutes). Runs only at milestones:
#   - manually (Actions tab > Emulator UI tests > Run workflow), or
#   - when a pushed commit message contains the marker [emulator]
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[emulator]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: gradle/actions/setup-gradle@v4
      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./scripts/run-emulator-tests.sh
      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-output
          path: build/emulator-out/**
          retention-days: 7
