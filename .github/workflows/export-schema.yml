name: Export Room schema (v1 baseline)
on:
  push:
    paths:
      - scripts/export-schema.trigger
  workflow_dispatch:
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Commit 4d61105 still has database version 1, so building it produces the real v1 schema JSON.
      - uses: actions/checkout@v4
        with:
          ref: 4d61105
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate schema
        run: |
          ./gradlew --no-daemon kspDebugKotlin
          find app/schemas -type f
          echo "=====BEGIN_SCHEMA====="
          cat app/schemas/app.atracker.data.db.AppDatabase/1.json
          echo "=====END_SCHEMA====="
